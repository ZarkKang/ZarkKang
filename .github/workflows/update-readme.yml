name: Update Profile Showcase

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SHOWCASE section
        uses: sansk/github-repo-display@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          topic: 'showcase'
          format: 'card'
          title: '🚀 Featured Projects'
          max_repos: 8
          show_description: true
          show_language: true
          show_stars: true
          show_forks: true
          show_topics: true
          commit_message: 'chore: refresh featured repos showcase'
